        // --- EDITOR DRAWER ---
        const EditorDrawer = ({
            isOpen, onClose, lyrics, setLyrics, currentProject,
            updateProjectAndSave, startManualSync, onReanalyze, hasApiKey
        }) => {
            const [localTitle, setLocalTitle] = useState("");
            const [localArtist, setLocalArtist] = useState("");
            const [localFont, setLocalFont] = useState("default");
            const [localMode, setLocalMode] = useState("classic");
            const [showLrcModal, setShowLrcModal] = useState(false);
            const [lrcInput, setLrcInput] = useState("");

            useEffect(() => {
                if (currentProject && isOpen) {
                    setLocalTitle(currentProject.name || "");
                    setLocalArtist(currentProject.artist || "Bilinmiyor");
                    setLocalFont(currentProject.fontId || "default");
                    setLocalMode(currentProject.themeMode || "classic");
                }
            }, [currentProject, isOpen]);

            const handleSaveAndClose = () => {
                const sorted = [...lyrics].sort((a, b) => a.ms - b.ms);
                setLyrics(sorted);
                updateProjectAndSave({
                    name: localTitle.trim() || "İsimsiz Parça",
                    artist: localArtist.trim() || "Bilinmiyor",
                    fontId: localFont,
                    themeMode: localMode,
                    lyrics: sorted
                });
                onClose();
            };

            const handleDownloadLRC = () => {
                const content = exportToLRC(lyrics, localTitle, localArtist);
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${localTitle || 'lyrics'}.lrc`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportLRC = () => {
                const parsed = parseLRC(lrcInput);
                if (parsed.length > 0) {
                    setLyrics(parsed);
                    setShowLrcModal(false);
                    setLrcInput("");
                }
            };

            const shiftAllTimestamps = (deltaMs) => {
                setLyrics(prev => prev.map(l => ({ ...l, ms: Math.max(0, l.ms + deltaMs) })));
            };

            return (
                <>
                    {isOpen && <div onClick={handleSaveAndClose} className="fixed inset-0 bg-black/60 backdrop-blur-xs z-[55] fade-in"></div>}
                    <div className={`fixed inset-y-0 left-0 w-full max-w-md bg-[#121215] border-r border-white/10 z-[60] flex flex-col transition-transform duration-300 ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="pt-11 px-5 pb-4 border-b border-white/10 flex justify-between items-center bg-[#121215] shrink-0">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <Icon className="text-blue-400" name="SlidersHorizontal" size={18} /> Stüdyo Editörü
                            </h2>
                            <button onClick={handleSaveAndClose} className="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded-full text-white text-xs font-bold flex items-center gap-1">
                                <Icon name="Check" size={16} /> Bitti
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-28 no-scrollbar">
                            <div className="bg-black/50 p-4 rounded-2xl border border-white/5 space-y-3">
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] text-gray-500 font-bold uppercase">Şarkı Adı</label>
                                        <input type="text" value={localTitle} onChange={e => setLocalTitle(e.target.value)} className="w-full bg-transparent border-b border-gray-700 focus:border-blue-500 text-white text-sm py-1" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-gray-500 font-bold uppercase">Sanatçı</label>
                                        <input type="text" value={localArtist} onChange={e => setLocalArtist(e.target.value)} className="w-full bg-transparent border-b border-gray-700 focus:border-blue-500 text-white text-sm py-1" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 pt-1">
                                    <select value={localMode} onChange={e => setLocalMode(e.target.value)} className="bg-[#1c1c21] text-white text-xs p-2.5 rounded-xl border border-white/10">
                                        <option value="classic">Mod: Klasik Akış</option>
                                        <option value="nostalgic">Mod: Sinematik Video</option>
                                    </select>
                                    <select value={localFont} onChange={e => setLocalFont(e.target.value)} className="bg-[#1c1c21] text-white text-xs p-2.5 rounded-xl border border-white/10">
                                        {FONTS.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={startManualSync} className="bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 py-3 px-3 rounded-xl font-bold text-xs border border-blue-500/30 flex items-center justify-center gap-1.5">
                                    <Icon name="Fingerprint" size={16} /> Ritim Tut (Tap)
                                </button>
                                {hasApiKey && (
                                    <button onClick={() => { handleSaveAndClose(); onReanalyze(); }} className="bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 py-3 px-3 rounded-xl font-bold text-xs border border-purple-500/30 flex items-center justify-center gap-1.5">
                                        <Icon name="Sparkles" size={16} /> AI Yeniden Çöz
                                    </button>
                                )}
                            </div>

                            <div className="flex items-center justify-between bg-white/[0.03] px-3 py-2 rounded-xl border border-white/5 text-[11px]">
                                <span className="text-gray-400">Tüm Zamanı Kaydır:</span>
                                <div className="flex gap-1.5">
                                    <button onClick={() => shiftAllTimestamps(-250)} className="px-2 py-1 bg-white/10 rounded-lg hover:bg-white/20">-0.25s</button>
                                    <button onClick={() => shiftAllTimestamps(250)} className="px-2 py-1 bg-white/10 rounded-lg hover:bg-white/20">+0.25s</button>
                                </div>
                            </div>

                            <div className="flex justify-between items-center pt-2 px-1">
                                <div className="flex gap-2">
                                    <button onClick={() => setShowLrcModal(!showLrcModal)} className="text-[11px] bg-white/10 text-gray-200 px-2.5 py-1 rounded-lg hover:bg-white/15">LRC Yapıştır</button>
                                    <button onClick={handleDownloadLRC} className="text-[11px] bg-white/10 text-gray-200 px-2.5 py-1 rounded-lg hover:bg-white/15">LRC İndir</button>
                                </div>
                                <button
                                    onClick={() => setLyrics(prev => [...prev, { text: "Yeni satır...", ms: (prev[prev.length - 1]?.ms || 0) + 2500 }])}
                                    className="text-xs bg-blue-500/20 text-blue-400 font-bold px-3 py-1 rounded-full"
                                >
                                    + Satır
                                </button>
                            </div>

                            {showLrcModal && (
                                <div className="bg-black p-3 rounded-xl border border-blue-500/40 space-y-2">
                                    <textarea
                                        rows={4}
                                        value={lrcInput}
                                        onChange={e => setLrcInput(e.target.value)}
                                        placeholder="[00:15.20] Örnek şarkı sözü satırı..."
                                        className="w-full bg-[#18181b] text-white text-xs p-2.5 rounded-lg border border-white/10"
                                    />
                                    <button onClick={handleImportLRC} className="w-full py-2 bg-blue-600 text-white text-xs font-bold rounded-lg">LRC Uygula</button>
                                </div>
                            )}

                            <div className="space-y-2">
                                {lyrics.map((line, idx) => (
                                    <div key={idx} className="flex gap-2 items-center bg-black/70 p-2.5 rounded-xl border border-white/5 focus-within:border-blue-500/40">
                                        <input
                                            type="number"
                                            value={line.ms}
                                            onChange={(e) => {
                                                const val = parseInt(e.target.value, 10) || 0;
                                                setLyrics(prev => prev.map((item, i) => i === idx ? { ...item, ms: val } : item));
                                            }}
                                            className="w-16 bg-white/5 rounded-lg py-1 px-1.5 text-blue-400 text-xs font-mono text-right shrink-0"
                                        />
                                        <input
                                            type="text"
                                            value={line.text}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setLyrics(prev => prev.map((item, i) => i === idx ? { ...item, text: val } : item));
                                            }}
                                            className="flex-1 bg-transparent text-white text-sm px-1"
                                        />
                                        <button
                                            onClick={() => setLyrics(prev => prev.filter((_, i) => i !== idx))}
                                            className="text-gray-600 hover:text-red-400 p-1.5 shrink-0"
                                        >
                                            <Icon name="Trash2" size={15} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        // --- MAIN APPLICATION ---
        function App() {
            const [projects, setProjects] = useState(() => {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY_PROJECTS) || '[]'); } catch { return []; }
            });
            const [settings, setSettings] = useState(() => {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS) || '{"apiKey":"", "modelName":"gemini-2.5-flash"}'); }
                catch { return { apiKey: "", modelName: "gemini-2.5-flash" }; }
            });

            const saveSettings = (newSettings) => {
                setSettings(newSettings);
                localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(newSettings));
            };

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_PROJECTS, JSON.stringify(projects));
            }, [projects]);

            const [view, setView] = useState('projects');
            const [currentProject, setCurrentProject] = useState(null);
            const [manualSyncMode, setManualSyncMode] = useState(false);
            const [fileBlob, setFileBlob] = useState(null);
            const [videoBlob, setVideoBlob] = useState(null);
            const [coverBlobUrl, setCoverBlobUrl] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [lyrics, setLyrics] = useState([]);
            const [statusBanner, setStatusBanner] = useState({ visible: false, message: "", type: "bekle" });
            const [isLeftMenuOpen, setIsLeftMenuOpen] = useState(false);
            const [activeIndex, setActiveIndex] = useState(-1);
            const [syncState, setSyncState] = useState({ visible: false, type: 'center' });
            const [bassPulse, setBassPulse] = useState(0);

            const userHasScrolled = useRef(false);
            const isAutoScrolling = useRef(false);
            const audioRef = useRef(null);
            const videoRef = useRef(null);
            const lyricsContainerRef = useRef(null);
            const lineRefs = useRef([]);
            const rafRef = useRef(null);
            const fileInputRef = useRef(null);
            const customVideoInputRef = useRef(null);
            const coverFileInputRef = useRef(null);
            const audioCtxRef = useRef(null);
            const analyserRef = useRef(null);
            const aktifAbortControllerRef = useRef(null);
            const currentProjectIdRef = useRef(null);
            const bannerTimeoutRef = useRef(null);

            useEffect(() => {
                currentProjectIdRef.current = currentProject?.id || null;
            }, [currentProject]);

            const durumBannerGuncelle = useCallback((mesaj, tip = 'bekle', autoHideMs = 0) => {
                if (bannerTimeoutRef.current) {
                    clearTimeout(bannerTimeoutRef.current);
                    bannerTimeoutRef.current = null;
                }
                setStatusBanner({ visible: true, message: mesaj, type: tip });
                if (autoHideMs > 0) {
                    bannerTimeoutRef.current = setTimeout(() => {
                        setStatusBanner(prev => ({ ...prev, visible: false }));
                    }, autoHideMs);
                }
            }, []);

            const handleCloseStatusBanner = useCallback(() => {
                if (bannerTimeoutRef.current) {
                    clearTimeout(bannerTimeoutRef.current);
                    bannerTimeoutRef.current = null;
                }
                if (aktifAbortControllerRef.current) {
                    aktifAbortControllerRef.current.abort();
                    aktifAbortControllerRef.current = null;
                }
                setStatusBanner(prev => ({ ...prev, visible: false }));
            }, []);

            const effectiveApiKey = settings.apiKey;
            const currentFont = currentProject ? FONTS.find(f => f.id === currentProject.fontId) || FONTS[0] : FONTS[0];

            const formatTime = (seconds) => {
                if (!seconds || !isFinite(seconds) || seconds < 0) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const sortLyricsByTime = (arr) => [...arr].sort((a, b) => a.ms - b.ms);

            const setupAudioAnalyser = useCallback(() => {
                if (!audioRef.current || audioCtxRef.current) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 64;
                    const source = ctx.createMediaElementSource(audioRef.current);
                    source.connect(analyser);
                    analyser.connect(ctx.destination);
                    audioCtxRef.current = ctx;
                    analyserRef.current = analyser;
                } catch (e) {}
            }, []);

            const loadProject = async (project, initialAudioUrl = null, initialVideoUrl = null, initialCoverUrl = null) => {
                setCurrentProject(project);
                setLyrics(project.lyrics || []);
                setIsPlaying(false);
                setCurrentTime(0);
                setDuration(0);
                setActiveIndex(-1);
                userHasScrolled.current = false;
                setSyncState({ visible: false, type: 'center' });

                let resolvedAudio = initialAudioUrl;
                let resolvedVideo = initialVideoUrl;
                let resolvedCover = initialCoverUrl;

                if (!resolvedAudio) {
                    const storedAudio = await getMediaBlob(`${project.id}_audio`);
                    if (storedAudio) resolvedAudio = URL.createObjectURL(storedAudio);
                }
                if (!resolvedVideo && project.themeMode === 'nostalgic') {
                    const storedVideo = await getMediaBlob(`${project.id}_video`);
                    if (storedVideo) resolvedVideo = URL.createObjectURL(storedVideo);
                }
                if (!resolvedCover) {
                    const storedCover = await getMediaBlob(`${project.id}_cover`);
                    if (storedCover) resolvedCover = URL.createObjectURL(storedCover);
                }

                setFileBlob(resolvedAudio);
                setVideoBlob(resolvedVideo);
                setCoverBlobUrl(resolvedCover);
                setView('player');
            };

            const createNewProject = (newP, audioUrl, videoUrl, coverUrl) => {
                setProjects(prev => [newP, ...prev]);
                loadProject(newP, audioUrl, videoUrl, coverUrl);
            };

            const deleteProject = async (e, projectId) => {
                e.stopPropagation();
                if (confirm("Bu projeyi ve yerel medya dosyalarını silmek istediğine emin misin?")) {
                    await deleteProjectMedia(projectId);
                    setProjects(prev => prev.filter(p => p.id !== projectId));
                }
            };

            const updateProjectAndSave = (updates) => {
                if (!currentProject) return;
                const updated = { ...currentProject, ...updates };
                if (updates.lyrics) updated.lyrics = sortLyricsByTime(updates.lyrics);
                setCurrentProject(updated);
                setProjects(prev => prev.map(p => p.id === updated.id ? updated : p));
            };

            const handleBackToMenu = () => {
                if (currentProject) updateProjectAndSave({ lyrics });
                if (audioRef.current) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                }
                setView('projects');
            };

            // Manuel galeriden kapak seçme
            const handleCoverChange = async (e) => {
                const file = e.target.files?.[0];
                if (!file || !currentProject) return;
                await saveMediaBlob(`${currentProject.id}_cover`, file);
                setCoverBlobUrl(URL.createObjectURL(file));
                e.target.value = "";
            };

            useEffect(() => {
                const freqData = new Uint8Array(32);
                const loop = () => {
                    if (audioRef.current && !audioRef.current.paused) {
                        setCurrentTime(audioRef.current.currentTime * 1000);
                        if (analyserRef.current) {
                            analyserRef.current.getByteFrequencyData(freqData);
                            const bass = (freqData[0] + freqData[1] + freqData[2]) / (3 * 255);
                            setBassPulse(bass);
                        }
                        rafRef.current = requestAnimationFrame(loop);
                    }
                };
                if (isPlaying) {
                    rafRef.current = requestAnimationFrame(loop);
                } else {
                    setBassPulse(0);
                    if (rafRef.current) cancelAnimationFrame(rafRef.current);
                }
                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, [isPlaying]);

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;
                const onMeta = () => setDuration(audio.duration || 0);
                const onEnded = () => setIsPlaying(false);
                const onTime = () => { if (!isPlaying) setCurrentTime(audio.currentTime * 1000); };
                audio.addEventListener('loadedmetadata', onMeta);
                audio.addEventListener('ended', onEnded);
                audio.addEventListener('timeupdate', onTime);
                return () => {
                    audio.removeEventListener('loadedmetadata', onMeta);
                    audio.removeEventListener('ended', onEnded);
                    audio.removeEventListener('timeupdate', onTime);
                };
            }, [isPlaying, fileBlob]);

            useEffect(() => {
                const video = videoRef.current;
                if (video && currentProject?.themeMode === 'nostalgic' && videoBlob) {
                    if (isPlaying) video.play().catch(() => {});
                    else video.pause();
                }
            }, [isPlaying, currentProject, videoBlob]);

            useEffect(() => {
                if (lyrics.length === 0) {
                    setActiveIndex(-1);
                    return;
                }
                let found = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const start = lyrics[i].ms - ANIMATION_OFFSET_MS;
                    const nextStart = lyrics[i + 1] ? lyrics[i + 1].ms - ANIMATION_OFFSET_MS : Infinity;
                    if (currentTime >= start && currentTime < nextStart) {
                        found = i;
                        break;
                    }
                }
                if (found !== activeIndex) setActiveIndex(found);
            }, [currentTime, lyrics, activeIndex]);

            const handleScroll = useCallback(() => {
                if (currentProject?.themeMode !== 'classic' || !isPlaying || isAutoScrolling.current || !lyricsContainerRef.current || activeIndex === -1) return;
                userHasScrolled.current = true;
                const container = lyricsContainerRef.current;
                const activeEl = lineRefs.current[activeIndex];
                if (activeEl) {
                    const rect = activeEl.getBoundingClientRect();
                    const cRect = container.getBoundingClientRect();
                    let type = 'center';
                    if (rect.bottom < cRect.top + 60) type = 'up';
                    else if (rect.top > cRect.bottom - 60) type = 'down';
                    setSyncState({ visible: true, type });
                }
            }, [activeIndex, isPlaying, currentProject]);

            useEffect(() => {
                if (view !== 'player' || userHasScrolled.current || !isPlaying || activeIndex === -1 || currentProject?.themeMode !== 'classic' || !lyricsContainerRef.current) return;
                const container = lyricsContainerRef.current;
                const activeEl = lineRefs.current[activeIndex];
                if (activeEl) {
                    isAutoScrolling.current = true;
                    const targetTop = activeEl.offsetTop - (container.clientHeight / 2) + (activeEl.clientHeight / 2);
                    container.scrollTo({ top: targetTop, behavior: 'smooth' });
                    const t = setTimeout(() => { isAutoScrolling.current = false; }, 550);
                    return () => clearTimeout(t);
                }
            }, [activeIndex, view, isPlaying, currentProject]);

            const togglePlay = useCallback(() => {
                if (!audioRef.current || !fileBlob) return;
                setupAudioAnalyser();
                if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play()
                        .then(() => setIsPlaying(true))
                        .catch(() => durumBannerGuncelle("ses oynatılamadı. lütfen dosyayı tekrar seç.", "hata"));
                }
            }, [fileBlob, isPlaying, setupAudioAnalyser, durumBannerGuncelle]);

            const seekAudio = useCallback((ms) => {
                if (!audioRef.current || !fileBlob) return;
                const maxMs = (duration || 0) * 1000;
                const clampedMs = Math.max(0, maxMs > 0 ? Math.min(ms, maxMs) : ms);
                audioRef.current.currentTime = clampedMs / 1000;
                setCurrentTime(clampedMs);
                if (videoRef.current && videoRef.current.duration) {
                    videoRef.current.currentTime = (clampedMs / 1000) % videoRef.current.duration;
                }
                userHasScrolled.current = false;
                setSyncState(prev => ({ ...prev, visible: false }));
            }, [fileBlob, duration]);

            const handleReupload = async (e) => {
                const file = e.target.files[0];
                if (!file || !currentProject) return;
                await saveMediaBlob(`${currentProject.id}_audio`, file);
                setFileBlob(URL.createObjectURL(file));

                // Eğer projenin henüz kapağı yoksa yeni yüklenen mp3'ten gömülü kapağı çek
                if (!coverBlobUrl) {
                    const embeddedCover = await extractMp3CoverBlob(file);
                    if (embeddedCover) {
                        await saveMediaBlob(`${currentProject.id}_cover`, embeddedCover);
                        setCoverBlobUrl(URL.createObjectURL(embeddedCover));
                    }
                }
                setStatusBanner(prev => ({ ...prev, visible: false }));
            };

            const handleCustomVideoReupload = async (e) => {
                const file = e.target.files[0];
                if (!file || !currentProject) return;
                await saveMediaBlob(`${currentProject.id}_video`, file);
                setVideoBlob(URL.createObjectURL(file));
                updateProjectAndSave({ bgVideoType: 'custom' });
            };

            // --- MODEL KİLİTLİ + OTOMATİK YENİDEN DENEMELİ + MOBİL BİLDİRİMLİ ANALİZ ---
            const analyzeFile = async (file, projectToUpdate, modeOverride = null) => {
                if (!effectiveApiKey) {
                    durumBannerGuncelle("analiz için ayarlar'dan gemini api key girmelisin.", "hata");
                    return;
                }
                if (file.size > 19 * 1024 * 1024) {
                    durumBannerGuncelle("dosya boyutu 19MB'dan büyük. daha küçük boyutlu bir mp3 kullan.", "hata");
                    return;
                }

                await bildirimHazirla();

                if (aktifAbortControllerRef.current) {
                    aktifAbortControllerRef.current.abort();
                }
                const controller = new AbortController();
                aktifAbortControllerRef.current = controller;

                const seciliModel = settings.modelName || "gemini-2.5-flash";
                const activeMode = modeOverride || projectToUpdate.themeMode;

                let wakeLock = null;
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen').catch(() => null);
                }

                durumBannerGuncelle(`ses dosyası hazırlanıyor (${seciliModel})...`, 'bekle');

                try {
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = () => reject(new Error("KALICI_HATA: dosya okunamadı."));
                        reader.readAsDataURL(file);
                    });

                    const styleInstruction = activeMode === 'nostalgic'
                        ? "Group lyrics into natural poetic sentences (max 10-12 words per entry) suitable for cinema subtitles."
                        : "Split lyrics into rhythmic karaoke lines (4-7 words per line). Start every line with a capital letter.";

                    const prompt = `Listen carefully to this audio track and transcribe all vocal lyrics with exact start timestamps in milliseconds (ms).
${styleInstruction}
Also detect the likely artist name if recognizable, otherwise return "Bilinmiyor".
Return ONLY valid JSON matching this exact schema:
{
  "artist": "Artist Name",
  "lyrics": [
    { "text": "First lyric line", "ms": 12400 }
  ]
}`;

                    const audioPayload = {
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { data: base64, mimeType: file.type || "audio/mpeg" } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            temperature: 0.2
                        }
                    };

                    let deneme = 0;
                    let beklemeSuresiMs = 3000; // ilk hatada 3 sn bekle, sonra katlayarak artar (max 20 sn)

                    while (true) {
                        if (controller.signal.aborted) {
                            throw new DOMException('Aborted', 'AbortError');
                        }

                        deneme++;
                        durumBannerGuncelle(
                            deneme === 1
                                ? `${seciliModel} ses dalgalarını çözümlüyor...`
                                : `${seciliModel} şu an yoğun, otomatik tekrar deneniyor... (deneme ${deneme})`,
                            'bekle'
                        );

                        try {
                            // DİKKAT: burada sadece seciliModel kullanılır, asla yedek modele fallback yapılmaz
                            const res = await fetch(
                                `https://generativelanguage.googleapis.com/v1beta/models/${seciliModel}:generateContent?key=${effectiveApiKey}`,
                                {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify(audioPayload),
                                    signal: controller.signal
                                }
                            );

                            const data = await res.json().catch(() => ({}));
                            const errMsg = data?.error?.message || res.statusText || "";

                            // 503 (high demand) veya 429 (rate limit) geldiyse döngüye devam et
                            if (
                                res.status === 503 ||
                                res.status === 429 ||
                                errMsg.toLowerCase().includes('high demand') ||
                                errMsg.toLowerCase().includes('overloaded') ||
                                errMsg.toLowerCase().includes('temporarily unavailable')
                            ) {
                                throw new Error('HIGH_DEMAND');
                            }

                            // api key hatası veya model adı hatası gibi kalıcı sorunlarda döngüden çık
                            if (!res.ok || data?.error) {
                                throw new Error(`KALICI_HATA: ${errMsg || 'bilinmeyen api hatası'}`);
                            }

                            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                            const cleanedJson = rawText.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
                            const parsed = JSON.parse(cleanedJson);

                            const rawLyrics = Array.isArray(parsed) ? parsed : (parsed.lyrics || []);
                            if (!Array.isArray(rawLyrics) || rawLyrics.length === 0) {
                                throw new Error("KALICI_HATA: ses içinde çözümlenebilir vokal söz bulunamadı.");
                            }

                            const sanitized = sortLyricsByTime(
                                rawLyrics
                                    .filter(item => item && typeof item.text === 'string' && item.text.trim())
                                    .map(item => ({
                                        text: item.text.trim(),
                                        ms: Math.max(0, Number(item.ms) || 0)
                                    }))
                            );

                            const detectedArtist = (!Array.isArray(parsed) && parsed.artist && parsed.artist !== "Bilinmiyor")
                                ? parsed.artist
                                : projectToUpdate.artist;

                            setProjects(prev => prev.map(p =>
                                p.id === projectToUpdate.id ? { ...p, lyrics: sanitized, artist: detectedArtist } : p
                            ));

                            if (currentProjectIdRef.current === projectToUpdate.id) {
                                setLyrics(sanitized);
                                setCurrentProject(prev => prev ? { ...prev, lyrics: sanitized, artist: detectedArtist } : prev);
                            }

                            durumBannerGuncelle('analiz tamamlandı, sözler eklendi.', 'basari', 5000);
                            await sarkiHazirBildirimiGonder(projectToUpdate.name);
                            return;

                        } catch (err) {
                            if (err.name === 'AbortError') {
                                durumBannerGuncelle('analiz iptal edildi.', 'hata', 3000);
                                return;
                            }

                            if (err.message && err.message.startsWith('KALICI_HATA')) {
                                durumBannerGuncelle(err.message.replace('KALICI_HATA: ', ''), 'hata');
                                return;
                            }

                            // yoğunluk veya geçici ağ hatası: bekle ve tekrar dene
                            const saniye = Math.round(beklemeSuresiMs / 1000);
                            durumBannerGuncelle(
                                `model yoğun (${seciliModel}), ${saniye} sn içinde tekrar denenecek... (#${deneme})`,
                                'bekle'
                            );

                            await new Promise((resolve, reject) => {
                                const timer = setTimeout(resolve, beklemeSuresiMs);
                                controller.signal.addEventListener('abort', () => {
                                    clearTimeout(timer);
                                    reject(new DOMException('Aborted', 'AbortError'));
                                }, { once: true });
                            });

                            // üst üste çakışmasın diye hafif rastgelelik + tavan 20 saniye
                            beklemeSuresiMs = Math.min(beklemeSuresiMs * 1.6 + Math.random() * 1000, 20000);
                        }
                    }
                } catch (outerErr) {
                    if (outerErr.name === 'AbortError') {
                        durumBannerGuncelle('analiz iptal edildi.', 'hata', 3000);
                    } else {
                        durumBannerGuncelle(outerErr.message?.replace('KALICI_HATA: ', '') || 'beklenmeyen bir hata oluştu.', 'hata');
                    }
                } finally {
                    if (aktifAbortControllerRef.current === controller) {
                        aktifAbortControllerRef.current = null;
                    }
                    if (wakeLock) wakeLock.release().catch(() => {});
                }
            };

            const handleReanalyzeFromEditor = async () => {
                if (!currentProject) return;
                const storedAudio = await getMediaBlob(`${currentProject.id}_audio`);
                if (!storedAudio) {
                    durumBannerGuncelle("yeniden analiz için ses dosyasını tekrar seçmelisin.", "hata");
                    return;
                }
                analyzeFile(storedAudio, currentProject, currentProject.themeMode);
            };

            const onSyncClick = useCallback(() => {
                if (activeIndex !== -1 && lyricsContainerRef.current && lineRefs.current[activeIndex]) {
                    isAutoScrolling.current = true;
                    userHasScrolled.current = false;
                    setSyncState(prev => ({ ...prev, visible: false }));
                    const container = lyricsContainerRef.current;
                    const activeEl = lineRefs.current[activeIndex];
                    const topPos = activeEl.offsetTop - (container.clientHeight / 2) + (activeEl.clientHeight / 2);
                    container.scrollTo({ top: topPos, behavior: 'smooth' });
                    setTimeout(() => { isAutoScrolling.current = false; }, 650);
                }
            }, [activeIndex]);

            const renderAlbumArt = () => {
                if (!currentProject) return null;
                if (coverBlobUrl) {
                    return <img src={coverBlobUrl} alt={currentProject.name} className="w-full h-full object-cover" />;
                }
                const ArtComponent = ALBUM_ARTS[(currentProject.fileName?.length || 0) % ALBUM_ARTS.length];
                return <ArtComponent />;
            };

            const progressPercent = duration > 0 ? Math.min(100, Math.max(0, ((currentTime / 1000) / duration) * 100)) : 0;

            return (
                <div className={`fixed inset-0 w-full h-full bg-black overflow-hidden select-none ${currentFont.class}`}>
                    <audio
                        ref={audioRef}
                        src={fileBlob || undefined}
                        className="hidden"
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                    />
                    <input type="file" ref={fileInputRef} accept="audio/*" className="hidden" onChange={handleReupload} />
                    <input type="file" ref={customVideoInputRef} accept="video/*" className="hidden" onChange={handleCustomVideoReupload} />
                    <input type="file" id="cover-file-input" ref={coverFileInputRef} accept="image/*" hidden onChange={handleCoverChange} />

                    {/* ÜST DURUM BANNERI (Turuncu Bekleme / Kırmızı Hata / Yeşil Başarı) */}
                    {statusBanner.visible && (
                        <div
                            id="ai-status-banner"
                            className={`status-banner ${statusBanner.type} fixed top-12 left-4 right-4 max-w-lg mx-auto z-[120] p-3.5 rounded-2xl flex items-center gap-3 shadow-2xl fade-in`}
                        >
                            {statusBanner.type === 'bekle' && (
                                <div className="w-4 h-4 rounded-full border-2 border-amber-300/30 border-t-amber-300 animate-spin shrink-0"></div>
                            )}
                            {statusBanner.type === 'hata' && (
                                <Icon name="AlertTriangle" className="text-red-300 shrink-0" size={18} />
                            )}
                            {statusBanner.type === 'basari' && (
                                <Icon name="CheckCircle2" className="text-emerald-300 shrink-0" size={18} />
                            )}
                            <span id="ai-status-text" className="text-xs font-medium leading-relaxed flex-1">
                                {statusBanner.message}
                            </span>
                            <button
                                id="ai-status-close"
                                onClick={handleCloseStatusBanner}
                                title="Kapat / İptal Et"
                                className="p-1.5 rounded-full hover:bg-white/15 text-white/80 hover:text-white shrink-0 transition-colors"
                            >
                                <Icon name="X" size={16} />
                            </button>
                        </div>
                    )}

                    {manualSyncMode && (
                        <ManualSyncView
                            lyrics={lyrics}
                            setLyrics={setLyrics}
                            onClose={() => setManualSyncMode(false)}
                            audioRef={audioRef}
                            setIsPlaying={setIsPlaying}
                        />
                    )}

                    <EditorDrawer
                        isOpen={isLeftMenuOpen}
                        onClose={() => setIsLeftMenuOpen(false)}
                        lyrics={lyrics}
                        setLyrics={setLyrics}
                        currentProject={currentProject}
                        updateProjectAndSave={updateProjectAndSave}
                        startManualSync={() => { setIsLeftMenuOpen(false); setManualSyncMode(true); }}
                        onReanalyze={handleReanalyzeFromEditor}
                        hasApiKey={Boolean(effectiveApiKey)}
                    />

                    {view === 'projects' && (
                        <ProjectsView
                            projects={projects}
                            setView={setView}
                            loadProject={loadProject}
                            deleteProject={deleteProject}
                            effectiveApiKey={effectiveApiKey}
                        />
                    )}

                    {view === 'createProject' && (
                        <CreateProjectWizard
                            setView={setView}
                            createNewProject={createNewProject}
                            analyzeFile={analyzeFile}
                            effectiveApiKey={effectiveApiKey}
                        />
                    )}

                    {view === 'settings' && (
                        <SettingsView
                            setView={setView}
                            settings={settings}
                            saveSettings={saveSettings}
                        />
                    )}

                    {/* PLAYER STAGE */}
                    <div className={`fixed inset-0 bg-black transition-transform duration-500 ${view === 'player' ? 'translate-x-0' : 'translate-x-full'}`}>
                        {currentProject && view === 'player' && (
                            <>
                                {currentProject.themeMode === 'nostalgic' ? (
                                    <div className="absolute inset-0 z-0 overflow-hidden bg-black">
                                        {videoBlob ? (
                                            <video
                                                ref={videoRef}
                                                src={videoBlob}
                                                className="w-full h-full object-cover opacity-65 scale-105"
                                                loop
                                                muted
                                                playsInline
                                            />
                                        ) : (
                                            <div className="w-full h-full bg-gradient-to-br from-purple-950/40 via-black to-indigo-950/40"></div>
                                        )}
                                        <div className="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-black/70"></div>
                                        <div className="absolute top-24 left-6 z-20">
                                            <button
                                                onClick={() => customVideoInputRef.current.click()}
                                                className="glass-button px-3.5 py-1.5 rounded-full text-[11px] text-gray-300 flex items-center gap-1.5 hover:text-white"
                                            >
                                                <Icon name="Video" size={13} /> {videoBlob ? "Videoyu Değiştir" : "Arka Plan Videosu Ekle"}
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div
                                        className="absolute inset-0 z-0 transition-transform duration-150"
                                        style={{
                                            background: `radial-gradient(circle at 20% 25%, rgba(59, 130, 246, ${0.14 + bassPulse * 0.22}) 0%, rgba(139, 92, 246, ${0.08 + bassPulse * 0.14}) 38%, #000000 75%)`,
                                            transform: `scale(${1 + bassPulse * 0.04})`
                                        }}
                                    ></div>
                                )}

                                <div className="pt-11 px-6 pb-4 z-30 absolute top-0 left-0 right-0 flex items-center justify-between">
                                    <button onClick={handleBackToMenu} className="glass-button py-2 px-4 rounded-full text-white flex items-center gap-1 text-xs font-bold">
                                        <Icon name="ChevronLeft" size={16} /> Projeler
                                    </button>
                                    <button onClick={() => setIsLeftMenuOpen(true)} className="glass-button p-2.5 rounded-full text-white hover:bg-white/20">
                                        <Icon name="SlidersHorizontal" size={18} />
                                    </button>
                                </div>

                                {!fileBlob && (
                                    <div className="absolute inset-0 z-40 flex flex-col items-center justify-center p-8 text-center bg-black/85 backdrop-blur-xl">
                                        <Icon name="FileAudio" size={56} className="text-blue-400 mb-5" />
                                        <h3 className="text-white font-bold text-xl mb-2">{currentProject.fileName}</h3>
                                        <p className="text-gray-400 text-xs mb-6 max-w-xs leading-relaxed">
                                            Bu projenin ses dosyası yerel önbellekte bulunamadı. Devam etmek için dosyayı yeniden bağla.
                                        </p>
                                        <button onClick={() => fileInputRef.current.click()} className="bg-blue-600 hover:bg-blue-500 px-7 py-3.5 rounded-full text-white text-sm font-bold shadow-lg">
                                            Ses Dosyasını Bağla
                                        </button>
                                    </div>
                                )}

                                {currentProject.themeMode === 'classic' && (
                                    <div className="absolute top-24 left-6 right-6 z-20">
                                        <div className="flex items-center gap-4">
                                            <div
                                                onClick={() => coverFileInputRef.current?.click()}
                                                title="Kapak değiştirmek için dokun"
                                                className="w-16 h-16 rounded-2xl overflow-hidden shadow-2xl border border-white/10 shrink-0 cursor-pointer active:scale-95 transition-transform"
                                            >
                                                {renderAlbumArt()}
                                            </div>
                                            <div className="overflow-hidden">
                                                <h1 className="text-xl font-extrabold text-white truncate">{currentProject.name}</h1>
                                                <p className="text-gray-400 text-sm font-medium truncate">{currentProject.artist || "Bilinmiyor"}</p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div
                                    ref={lyricsContainerRef}
                                    onScroll={handleScroll}
                                    className={`absolute inset-0 overflow-y-auto no-scrollbar z-10 overscroll-contain px-6 ${currentProject.themeMode === 'nostalgic' ? 'flex items-center justify-center' : 'top-44 bottom-40 lyrics-mask'}`}
                                >
                                    {lyrics.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-center text-gray-500">
                                            {/* KAPAK KUTUSU: "Bu projede henüz şarkı sözü yok." yazısının hemen üstü */}
                                            <div
                                                className="cover-wrapper"
                                                id="cover-box"
                                                title="kapak değiştirmek için dokun"
                                                onClick={() => coverFileInputRef.current?.click()}
                                            >
                                                {coverBlobUrl ? (
                                                    <img id="song-cover-img" src={coverBlobUrl} alt="şarkı kapağı" />
                                                ) : (
                                                    <div id="song-cover-placeholder" className="cover-placeholder">
                                                        <span>🎵</span>
                                                        <small>kapak ekle</small>
                                                    </div>
                                                )}
                                            </div>

                                            <p className="text-sm font-medium mb-3">Bu projede henüz şarkı sözü yok.</p>
                                            <button
                                                onClick={() => setIsLeftMenuOpen(true)}
                                                className="glass-button px-4 py-2 rounded-full text-xs text-blue-400 font-bold"
                                            >
                                                Editörü Aç & Söz Ekle
                                            </button>
                                        </div>
                                    ) : currentProject.themeMode === 'classic' ? (
                                        <div className="py-[28vh] space-y-7 max-w-2xl mx-auto">
                                            {lyrics.map((line, index) => {
                                                const isActive = index === activeIndex;
                                                const isPast = activeIndex !== -1 && index < activeIndex;
                                                return (
                                                    <div
                                                        key={index}
                                                        ref={el => lineRefs.current[index] = el}
                                                        onClick={() => seekAudio(line.ms)}
                                                        className={`relative transition-all duration-300 origin-left cursor-pointer pl-4 ${isActive ? 'scale-[1.04] opacity-100' : isPast ? 'opacity-35 hover:opacity-70' : 'opacity-45 hover:opacity-80'}`}
                                                    >
                                                        {isActive && <div className="active-line-bar"></div>}
                                                        <p className={`text-2xl md:text-3xl font-extrabold leading-snug tracking-tight ${isActive ? 'text-white drop-shadow-[0_2px_12px_rgba(255,255,255,0.25)]' : 'text-gray-300'}`}>
                                                            {line.text}
                                                        </p>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="w-full max-w-2xl flex justify-center text-center px-4">
                                            <div className={`transition-all duration-300 transform ${activeIndex !== -1 ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-95 translate-y-2'}`}>
                                                {activeIndex !== -1 && lyrics[activeIndex] && (
                                                    <p className={`text-white text-2xl md:text-4xl font-extrabold leading-relaxed tracking-wide clean-shadow ${currentFont.class}`}>
                                                        {lyrics[activeIndex].text}
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {currentProject.themeMode === 'classic' && (
                                    <SyncButton onClick={onSyncClick} type={syncState.type} visible={syncState.visible} />
                                )}

                                {fileBlob && (
                                    <div className="absolute bottom-0 left-0 right-0 pb-9 pt-6 px-6 bg-gradient-to-t from-black via-black/95 to-transparent z-30 flex flex-col items-center">
                                        <div className="w-full max-w-xl">
                                            <div
                                                className="w-full flex items-center gap-3 text-[11px] font-mono font-bold text-gray-400 mb-5 cursor-pointer py-2 group"
                                                onClick={(e) => {
                                                    if (!duration) return;
                                                    const r = e.currentTarget.getBoundingClientRect();
                                                    const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
                                                    seekAudio(ratio * duration * 1000);
                                                }}
                                            >
                                                <span className="w-10 text-right">{formatTime(currentTime / 1000)}</span>
                                                <div className="flex-1 h-1.5 bg-white/15 rounded-full overflow-hidden relative">
                                                    <div
                                                        className="h-full bg-white rounded-full group-hover:bg-blue-400 transition-colors"
                                                        style={{ width: `${progressPercent}%` }}
                                                    ></div>
                                                </div>
                                                <span className="w-10">{formatTime(duration)}</span>
                                            </div>

                                            <div className="flex items-center justify-center gap-10">
                                                <button onClick={() => seekAudio(currentTime - 5000)} className="text-gray-400 hover:text-white active:scale-90 transition-transform p-2">
                                                    <Icon name="RotateCcw" size={26} />
                                                </button>
                                                <button
                                                    onClick={togglePlay}
                                                    className="bg-white text-black w-16 h-16 rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-xl shadow-white/15"
                                                >
                                                    {isPlaying ? <Icon name="Pause" size={28} fill="currentColor" /> : <Icon name="Play" size={28} fill="currentColor" className="ml-1" />}
                                                </button>
                                                <button onClick={() => seekAudio(currentTime + 5000)} className="text-gray-400 hover:text-white active:scale-90 transition-transform p-2">
                                                    <Icon name="RotateCw" size={26} />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
