<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; media-src * data: blob:; style-src * 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LyricalAI Studio Pro</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Courier+Prime:wght@700&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .font-courier { font-family: 'Courier Prime', monospace; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-marker { font-family: 'Permanent Marker', cursive; }
        .font-default { font-family: 'Inter', sans-serif; }

        .glass-panel {
            background: rgba(24, 24, 28, 0.78);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Durum Banner Stilleri (bekle -> turuncu, hata -> kırmızı, basari -> yeşil) */
        .status-banner {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: all 0.25s ease;
        }
        .status-banner.bekle {
            background: rgba(120, 53, 15, 0.92);
            border: 1px solid rgba(251, 146, 60, 0.55);
            color: #ffedd5;
        }
        .status-banner.hata {
            background: rgba(127, 29, 29, 0.92);
            border: 1px solid rgba(248, 113, 113, 0.55);
            color: #fee2e2;
        }
        .status-banner.basari {
            background: rgba(6, 78, 59, 0.92);
            border: 1px solid rgba(52, 211, 153, 0.55);
            color: #d1fae5;
        }

        /* Şarkı Kapak Kutusu */
        .cover-wrapper {
            width: 170px;
            height: 170px;
            margin: 0 auto 22px auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, border-color 0.2s ease;
        }
        .cover-wrapper:hover {
            border-color: rgba(96, 165, 250, 0.45);
        }
        .cover-wrapper:active {
            transform: scale(0.97);
        }
        #song-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
        }
        .cover-placeholder span {
            font-size: 32px;
        }

        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideInBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translate(-50%, 30px) scale(0.85); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes ripple {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        @keyframes countPulse {
            0% { transform: scale(0.6); opacity: 0; }
            45% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-in-bottom { animation: slideInBottom 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        .sync-btn-enter { animation: slideUpFade 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-ripple { animation: ripple 0.55s ease-out forwards; }
        .count-anim { animation: countPulse 0.95s ease-out infinite; }

        .clean-shadow {
            text-shadow: 0 4px 18px rgba(0,0,0,0.9), 0 0 32px rgba(0,0,0,0.65);
        }
        .active-line-bar {
            position: absolute;
            left: 0;
            top: 10%;
            bottom: 10%;
            width: 4px;
            background: linear-gradient(180deg, #60a5fa, #a855f7);
            border-radius: 99px;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.7);
        }
        .lyrics-mask {
            mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 84%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 84%, transparent 100%);
        }
        input, textarea, select { appearance: none; -webkit-appearance: none; outline: none; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        // --- INDEXED DB MEDIA STORAGE ---
        const DB_NAME = 'LyricalAI_MediaDB_v1';
        const STORE_NAME = 'media_files';

        const openMediaDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const saveMediaBlob = async (key, blob) => {
            if (!blob) return;
            try {
                const db = await openMediaDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put(blob, key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) { console.warn('IndexedDB kayıt hatası:', e); }
        };

        const getMediaBlob = async (key) => {
            try {
                const db = await openMediaDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        };

        const deleteProjectMedia = async (projectId) => {
            try {
                const db = await openMediaDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(`${projectId}_audio`);
                tx.objectStore(STORE_NAME).delete(`${projectId}_video`);
                tx.objectStore(STORE_NAME).delete(`${projectId}_cover`);
            } catch (e) {}
        };

        // --- GÖMÜLÜ MP3 KAPAĞI ÇEKME (ID3v2 APIC) ---
        const extractMp3CoverBlob = async (audioFile) => {
            try {
                const buffer = await audioFile.slice(0, 1536 * 1024).arrayBuffer(); // ilk 1.5MB yeterli
                const view = new DataView(buffer);

                if (view.byteLength < 10 ||
                    String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2)) !== 'ID3') {
                    return null;
                }

                const version = view.getUint8(3);
                const tagSize =
                    ((view.getUint8(6) & 0x7f) << 21) |
                    ((view.getUint8(7) & 0x7f) << 14) |
                    ((view.getUint8(8) & 0x7f) << 7) |
                    (view.getUint8(9) & 0x7f);

                let offset = 10;
                const limit = Math.min(tagSize + 10, view.byteLength - 10);

                while (offset < limit) {
                    const frameId = String.fromCharCode(
                        view.getUint8(offset), view.getUint8(offset + 1),
                        view.getUint8(offset + 2), view.getUint8(offset + 3)
                    );
                    if (!frameId.trim() || frameId === '\0\0\0\0') break;

                    const frameSize = version === 4
                        ? ((view.getUint8(offset + 4) & 0x7f) << 21) |
                          ((view.getUint8(offset + 5) & 0x7f) << 14) |
                          ((view.getUint8(offset + 6) & 0x7f) << 7) |
                          (view.getUint8(offset + 7) & 0x7f)
                        : view.getUint32(offset + 4);

                    if (frameSize <= 0 || offset + 10 + frameSize > view.byteLength) break;

                    if (frameId === 'APIC') {
                        let p = offset + 10;
                        const encoding = view.getUint8(p++);
                        let mime = '';
                        while (p < offset + 10 + frameSize && view.getUint8(p) !== 0) {
                            mime += String.fromCharCode(view.getUint8(p++));
                        }
                        p += 2; // null byte + picture type byte atla

                        // açıklama (description) kısmını atla
                        if (encoding === 1 || encoding === 2) {
                            while (p + 1 < offset + 10 + frameSize && !(view.getUint8(p) === 0 && view.getUint8(p + 1) === 0)) p += 2;
                            p += 2;
                        } else {
                            while (p < offset + 10 + frameSize && view.getUint8(p) !== 0) p++;
                            p += 1;
                        }

                        if (p < offset + 10 + frameSize) {
                            const imgBytes = new Uint8Array(buffer, p, offset + 10 + frameSize - p);
                            return new Blob([imgBytes], { type: mime || 'image/jpeg' });
                        }
                    }

                    offset += 10 + frameSize;
                }
                return null;
            } catch (e) {
                return null;
            }
        };

        // --- MOBİL BİLDİRİM & SERVICE WORKER ---
        const bildirimHazirla = async () => {
            try {
                if ('Notification' in window && Notification.permission === 'default') {
                    await Notification.requestPermission().catch(() => {});
                }
                if ('serviceWorker' in navigator) {
                    const swCode = `self.addEventListener('notificationclick', e => { e.notification.close(); e.waitUntil(clients.openWindow('/')); });`;
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    await navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
                }
            } catch (e) {}
        };

        const sarkiHazirBildirimiGonder = async (sarkiAdi = 'şarkın') => {
            if ('vibrate' in navigator) {
                try { navigator.vibrate([200, 100, 200]); } catch (e) {}
            }

            if (!('Notification' in window) || Notification.permission !== 'granted') return;

            const baslik = 'şarkı hazır! 🎵';
            const secenekler = {
                body: `${sarkiAdi} için ai analizi tamamlandı, sözler seni bekliyor.`,
                vibrate: [200, 100, 200],
                tag: 'sarki-analiz-bitti',
                renotify: true
            };

            try {
                const reg = await Promise.race([
                    navigator.serviceWorker.ready,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('SW_TIMEOUT')), 1500))
                ]);
                await reg.showNotification(baslik, secenekler);
            } catch {
                try { new Notification(baslik, secenekler); } catch (e) {}
            }
        };

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 22, className = "", ...props }) => {
            if (!window.lucide || !window.lucide.icons) return null;
            const iconData = window.lucide.icons[name] || window.lucide.icons.HelpCircle;
            return React.createElement(
                'svg',
                {
                    xmlns: "http://www.w3.org/2000/svg",
                    width: size,
                    height: size,
                    viewBox: "0 0 24 24",
                    fill: "none",
                    stroke: "currentColor",
                    strokeWidth: 2,
                    strokeLinecap: "round",
                    strokeLinejoin: "round",
                    className,
                    ...props
                },
                iconData.map((c, i) => React.createElement(c[0], { key: i, ...c[1] }))
            );
        };

        // --- PROCEDURAL ALBUM ARTS ---
        const ArtCyber = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full bg-[#09090b]">
                <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#3b82f6"/><stop offset="100%" stopColor="#9333ea"/></linearGradient></defs>
                <rect width="100" height="100" fill="#09090b" />
                <circle cx="50" cy="50" r="28" fill="none" stroke="url(#g1)" strokeWidth="2.5"/>
                <circle cx="50" cy="50" r="38" fill="none" stroke="#333" strokeWidth="0.8" strokeDasharray="4 3" />
                <circle cx="50" cy="50" r="6" fill="url(#g1)" />
            </svg>
        );
        const ArtVinyl = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full bg-[#18181b]">
                <circle cx="50" cy="50" r="44" fill="#0f0f11" stroke="#27272a" strokeWidth="1.5"/>
                <circle cx="50" cy="50" r="30" fill="none" stroke="#27272a" strokeWidth="0.6"/>
                <circle cx="50" cy="50" r="16" fill="#eab308" />
                <circle cx="50" cy="50" r="3" fill="#09090b" />
            </svg>
        );
        const ArtAbstract = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full bg-[#0f172a]">
                <rect x="18" y="18" width="64" height="64" rx="16" fill="#3b82f6" opacity="0.45"/>
                <circle cx="70" cy="30" r="12" fill="#f43f5e" opacity="0.85"/>
                <circle cx="32" cy="70" r="16" fill="#10b981" opacity="0.75"/>
            </svg>
        );
        const ArtWave = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full bg-[#050505]">
                <path d="M0 45 Q 25 20 50 45 T 100 45" stroke="#8b5cf6" strokeWidth="2.5" fill="none"/>
                <path d="M0 58 Q 25 33 50 58 T 100 58" stroke="#ec4899" strokeWidth="2.5" fill="none" opacity="0.75"/>
                <path d="M0 71 Q 25 46 50 71 T 100 71" stroke="#3b82f6" strokeWidth="1.5" fill="none" opacity="0.5"/>
            </svg>
        );
        const ArtGeo = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full bg-[#121215]">
                <polygon points="50,14 88,82 12,82" fill="none" stroke="#fbbf24" strokeWidth="2.2"/>
                <circle cx="50" cy="56" r="10" fill="#fbbf24" opacity="0.9"/>
            </svg>
        );

        const ALBUM_ARTS = [ArtCyber, ArtVinyl, ArtAbstract, ArtWave, ArtGeo];
        const STORAGE_KEY_PROJECTS = 'lyrical_projects_v6';
        const STORAGE_KEY_SETTINGS = 'lyrical_settings_v4';
        const ANIMATION_OFFSET_MS = 180;

        const FONTS = [
            { name: "Modern (Inter)", class: "font-default", id: 'default' },
            { name: "Daktilo (Courier)", class: "font-courier", id: 'courier' },
            { name: "Zarif (Playfair)", class: "font-playfair", id: 'playfair' },
            { name: "Sinematik (Cinzel)", class: "font-cinzel", id: 'cinzel' },
            { name: "El Yazısı (Marker)", class: "font-marker", id: 'marker' }
        ];

        // --- LRC PARSER & FORMATTER ---
        const parseLRC = (lrcText) => {
            const lines = lrcText.split(/\r?\n/);
            const result = [];
            const regex = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\](.*)/;
            for (const raw of lines) {
                const match = raw.trim().match(regex);
                if (match) {
                    const mins = parseInt(match[1], 10);
                    const secs = parseInt(match[2], 10);
                    const msStr = match[3] || "0";
                    const ms = msStr.length === 2 ? parseInt(msStr, 10) * 10 : parseInt(msStr.padEnd(3, '0').slice(0, 3), 10);
                    const text = match[4].trim();
                    if (text) {
                        result.push({ ms: mins * 60000 + secs * 1000 + ms, text });
                    }
                }
            }
            return result.sort((a, b) => a.ms - b.ms);
        };

        const exportToLRC = (lyrics, title = "", artist = "") => {
            const header = `[ti:${title}]\n[ar:${artist}]\n[by:LyricalAI Studio]\n\n`;
            const body = lyrics.map(l => {
                const totalMs = Math.max(0, Math.floor(l.ms));
                const mins = Math.floor(totalMs / 60000);
                const secs = Math.floor((totalMs % 60000) / 1000);
                const hundredths = Math.floor((totalMs % 1000) / 10);
                return `[${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(hundredths).padStart(2, '0')}] ${l.text}`;
            }).join('\n');
            return header + body;
        };

        // --- SYNC FLOATING BUTTON ---
        const SyncButton = ({ onClick, type, visible }) => {
            if (!visible) return null;
            const iconName = type === 'up' ? 'ArrowUp' : type === 'down' ? 'ArrowDown' : 'Crosshair';
            return (
                <div className="absolute bottom-44 left-1/2 -translate-x-1/2 z-40 sync-btn-enter">
                    <button
                        onClick={(e) => { e.stopPropagation(); onClick(e); }}
                        className="bg-blue-600/90 hover:bg-blue-500 text-white px-5 py-2.5 rounded-full flex items-center gap-2.5 text-xs font-bold shadow-2xl shadow-blue-950 border border-blue-400/40 backdrop-blur-xl active:scale-95 transition-all"
                    >
                        <Icon name={iconName} size={16} />
                        <span>Satıra Odaklan</span>
                    </button>
                </div>
            );
        };

        // --- MANUAL TAP SYNC STUDIO ---
        const ManualSyncView = ({ lyrics, setLyrics, onClose, audioRef, setIsPlaying }) => {
            const [activeIndex, setActiveIndex] = useState(0);
            const [tempLyrics, setTempLyrics] = useState(() => lyrics.map(l => ({ ...l })));
            const [countdown, setCountdown] = useState(null);
            const [isStarted, setIsStarted] = useState(false);
            const [rippleKey, setRippleKey] = useState(0);
            const [offsetMs, setOffsetMs] = useState(0);

            const startProcess = () => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                }
                setIsStarted(true);
                setCountdown(3);
            };

            useEffect(() => {
                if (countdown === null) return;
                if (countdown > 0) {
                    const t = setTimeout(() => setCountdown(c => c - 1), 900);
                    return () => clearTimeout(t);
                } else {
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                    }
                    setCountdown(null);
                }
            }, [countdown, audioRef, setIsPlaying]);

            const handleTap = useCallback(() => {
                if (!audioRef.current || countdown !== null || activeIndex >= tempLyrics.length) return;
                setRippleKey(prev => prev + 1);
                const currentTimeMs = Math.max(0, Math.floor(audioRef.current.currentTime * 1000) + offsetMs);
                setTempLyrics(prev => {
                    const copy = [...prev];
                    copy[activeIndex] = { ...copy[activeIndex], ms: currentTimeMs };
                    return copy;
                });
                setActiveIndex(prev => prev + 1);
            }, [audioRef, countdown, activeIndex, tempLyrics.length, offsetMs]);

            const handleUndo = () => {
                if (activeIndex > 0) setActiveIndex(prev => prev - 1);
            };

            useEffect(() => {
                const onKeyDown = (e) => {
                    if (isStarted && countdown === null && (e.code === 'Space' || e.code === 'Enter')) {
                        e.preventDefault();
                        handleTap();
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [isStarted, countdown, handleTap]);

            const handleSave = () => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                }
                setLyrics([...tempLyrics].sort((a, b) => a.ms - b.ms));
                onClose();
            };

            return (
                <div className="fixed inset-0 z-[80] bg-black/95 backdrop-blur-3xl flex flex-col fade-in">
                    <div className="pt-10 px-6 pb-4 flex justify-between items-center border-b border-white/10">
                        <button onClick={onClose} className="p-2.5 bg-white/5 rounded-full hover:bg-white/10 text-gray-300">
                            <Icon name="X" size={20} />
                        </button>
                        <div className="text-center">
                            <h3 className="text-white font-bold text-base">Ritim Stüdyosu</h3>
                            <p className="text-[11px] text-gray-400">Ekrana dokunarak satırları yakala</p>
                        </div>
                        <button onClick={handleSave} className="px-4 py-2 bg-blue-600 rounded-full text-white font-bold text-xs hover:bg-blue-500 shadow-lg shadow-blue-900/40">
                            Kaydet
                        </button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-6 relative">
                        {countdown !== null && (
                            <div className="absolute inset-0 flex items-center justify-center z-50 bg-black/75 backdrop-blur-md">
                                <div className="text-8xl font-black text-white count-anim font-mono">{countdown}</div>
                            </div>
                        )}

                        {!isStarted ? (
                            <div className="text-center space-y-6 max-w-sm">
                                <div className="w-24 h-24 rounded-3xl bg-gradient-to-tr from-blue-600 to-purple-600 mx-auto flex items-center justify-center shadow-2xl shadow-blue-900/50">
                                    <Icon className="text-white" name="Fingerprint" size={44} />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold text-white mb-2">Canlı Zamanlama</h2>
                                    <p className="text-gray-400 text-sm leading-relaxed">
                                        Şarkı baştan çalacak. Sanatçı her satıra başladığı anda aşağıdaki büyük butona bas.
                                    </p>
                                </div>
                                <div className="glass-panel p-3 rounded-2xl flex items-center justify-between text-xs">
                                    <span className="text-gray-400">Gecikme Telafisi (ms):</span>
                                    <div className="flex items-center gap-2">

        // --- PROJECTS LIST VIEW ---
        const ProjectsView = ({ projects, setView, loadProject, deleteProject, effectiveApiKey }) => {
            const [search, setSearch] = useState("");
            const [coverThumbs, setCoverThumbs] = useState({});

            useEffect(() => {
                let cancelled = false;
                const loadThumbs = async () => {
                    const map = {};

                    }

            const filtered = useMemo(() =>
                projects.filter(p =>

        // --- CREATE PROJECT WIZARD ---
        const CreateProjectWizard = ({ setView, createNewProject, analyzeFile, effectiveApiKey }) => {

            const [name, setName] = useState("");
            const [artist, setArtist] = useState("");
            const [audioFile, setAudioFile] = useState(null);
            const [mode, setMode] = useState('classic');
            const [font, setFont] = useState('default');
            const [customBgFile, setCustomBgFile] = useState(null);
            const [skipAI, setSkipAI] = useState(!effectiveApiKey);
            const [manualText, setManualText] = useState("");

            const handleFinish = async () => {
                if (!name.trim() || !audioFile) return;
                const projectId = Date.now().toString();
                const audioUrl = URL.createObjectURL(audioFile);
                const videoUrl = (mode === 'nostalgic' && customBgFile) ? URL.createObjectURL(customBgFile) : null;

                await saveMediaBlob(`${projectId}_audio`, audioFile);
                if (customBgFile) {
                    await saveMediaBlob(`${projectId}_video`, customBgFile);
                }

                // MP3 dosyasının içinde gömülü albüm kapağı varsa otomatik sök ve kaydet
                let coverUrl = null;
                const embeddedCoverBlob = await extractMp3CoverBlob(audioFile);
                if (embeddedCoverBlob) {
                    await saveMediaBlob(`${projectId}_cover`, embeddedCoverBlob);
                    coverUrl = URL.createObjectURL(embeddedCoverBlob);
                }

                let initialLyrics = [];
                if (skipAI && manualText.trim()) {
                    const parsedLrc = parseLRC(manualText);
                    if (parsedLrc.length > 0) {
                        initialLyrics = parsedLrc;
                    } else {
                        initialLyrics = manualText
                            .split(/\r?\n/)
                            .map(s => s.trim())
                            .filter(Boolean)
                            .map((text, idx) => ({ text, ms: idx * 3000 }));
                    }
                }

                const newP = {
                    id: projectId,
                    createdAt: new Date().toISOString(),
                    name: name.trim(),
                    artist: artist.trim() || "Bilinmiyor",
                    themeMode: mode,
                    fontId: font,
                    fileName: audioFile.name,
                    fileType: audioFile.type || 'audio/mpeg',
                    bgVideoType: (mode === 'nostalgic' && customBgFile) ? 'custom' : 'none',
                    lyrics: initialLyrics
                };

                createNewProject(newP, audioUrl, videoUrl, coverUrl);
                if (!skipAI && effectiveApiKey) {
                    analyzeFile(audioFile, newP, mode);
                }
            };

            return (
                <div className="fixed inset-0 bg-black flex flex-col z-30 slide-in-bottom">
                    <div className="pt-12 px-6 pb-3 flex items-center justify-between">
                        <button onClick={() => step === 1 ? setView('projects') : setStep(1)} className="text-blue-400 flex items-center gap-1 font-semibold text-sm">
                            <Icon name="ChevronLeft" size={18} /> {step === 1 ? "İptal" : "Geri"}
                        </button>
                        <div className="flex gap-1.5">
                            <span className={`h-1.5 w-6 rounded-full transition-colors ${step >= 1 ? 'bg-blue-500' : 'bg-gray-800'}`}></span>
                            <span className={`h-1.5 w-6 rounded-full transition-colors ${step >= 2 ? 'bg-blue-500' : 'bg-gray-800'}`}></span>
                        </div>
                    </div>

                    <div className="px-6 pt-2 pb-5">
                        <h2 className="text-2xl font-extrabold text-white">
                            {step === 1 ? "Parça & Dosya Seçimi" : "Sahne & Mod Ayarları"}
                        </h2>
                        <p className="text-xs text-gray-400 mt-1">
                            {step === 1 ? "Ses dosyasını yükle, bilgileri düzenle." : "Oynatıcı atmosferini ve yazı stilini seç."}
                        </p>
                    </div>

                    <div className="flex-1 overflow-y-auto px-6 no-scrollbar pb-36">
                        {step === 1 ? (
                            <div className="space-y-5 fade-in">
                                <div>
                                    <label className="text-gray-400 text-[11px] font-bold uppercase tracking-wider ml-1 mb-2 block">Ses Dosyası *</label>
                                    <button
                                        onClick={() => document.getElementById('wiz-audio').click()}
                                        className={`w-full p-7 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center gap-2.5 transition-all ${audioFile ? 'border-blue-500 bg-blue-500/10' : 'border-gray-800 bg-[#141417] hover:border-gray-700'}`}
                                    >
                                        <Icon
                                            className={audioFile ? "text-blue-400" : "text-gray-500"}
                                            name={audioFile ? "CheckCircle2" : "UploadCloud"}
                                            size={32}
                                        />
                                        <span className="text-sm font-semibold text-gray-200 truncate max-w-[85%]">
                                            {audioFile ? audioFile.name : "MP3, WAV, M4A veya OGG Seç"}
                                        </span>
                                        {audioFile && <span className="text-[11px] text-blue-400">{(audioFile.size / (1024 * 1024)).toFixed(1)} MB • Cihaza kaydedilecek</span>}
                                    </button>
                                    <input
                                        type="file"
                                        id="wiz-audio"
                                        accept="audio/*"
                                        className="hidden"
                                        onChange={e => {
                                            const f = e.target.files[0];
                                            if (f) {
                                                setAudioFile(f);
                                                const cleanName = f.name.replace(/\.[^/.]+$/, "");
                                                if (cleanName.includes(" - ")) {
                                                    const [art, song] = cleanName.split(" - ");
                                                    if (!artist) setArtist(art.trim());
                                                    if (!name) setName(song.trim());
                                                } else if (!name) {
                                                    setName(cleanName);
                                                }
                                            }
                                        }}
                                    />
                                </div>

                                <div>
                                    <label className="text-gray-400 text-[11px] font-bold uppercase tracking-wider ml-1 mb-2 block">Şarkı Adı *</label>
                                    <input
                                        type="text"
                                        value={name}
                                        onChange={e => setName(e.target.value)}
                                        className="w-full bg-[#141417] text-white p-4 rounded-2xl border border-white/10 focus:border-blue-500 text-base"
                                        placeholder="Örn: Gece Yarısı"
                                    />
                                </div>

                                <div>
                                    <label className="text-gray-400 text-[11px] font-bold uppercase tracking-wider ml-1 mb-2 block">Sanatçı</label>
                                    <input
                                        type="text"
                                        value={artist}
                                        onChange={e => setArtist(e.target.value)}
                                        className="w-full bg-[#141417] text-white p-4 rounded-2xl border border-white/10 focus:border-blue-500 text-base"
                                        placeholder="Boş bırakırsan AI tahmin eder"
                                    />
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6 fade-in">
                                <div>
                                    <label className="text-gray-400 text-[11px] font-bold uppercase tracking-wider ml-1 mb-2 block">Görünüm Modu</label>

                                            onClick={() => setMode('classic')}
                                            className={`p-4 rounded-2xl border text-left transition-all ${mode === 'classic' ? 'bg-blue-600/20 border-blue-500' : 'bg-[#141417] border-white/5'}`}
                                        >
                                            <Icon className={mode === 'classic' ? 'text-blue-400 mb-2' : 'text-gray-500 mb-2'} name="AlignLeft" size={22} />
                                            <h4 className="font-bold text-sm text-white">Klasik Akış</h4>
                                            <p className="text-[11px] text-gray-400 mt-0.5">Apple Music tarzı kayan sözler</p>
                                        </button>
                                        <button
                                            onClick={() => setMode('nostalgic')}
                                            className={`p-4 rounded-2xl border text-left transition-all ${mode === 'nostalgic' ? 'bg-purple-600/20 border-purple-500' : 'bg-[#141417] border-white/5'}`}
                                        >
                                            <Icon className={mode === 'nostalgic' ? 'text-purple-400 mb-2' : 'text-gray-500 mb-2'} name="Film" size={22} />
                                            <h4 className="font-bold text-sm text-white">Sinematik Video</h4>
                                            <p className="text-[11px] text-gray-400 mt-0.5">Arka plan videosu + altyazı</p>
                                        </button>
                                    </div>
                                </div>

                                {mode === 'nostalgic' && (
                                    <div className="fade-in">
                                        <label className="text-gray-400 text-[11px] font-bold uppercase tracking-wider ml-1 mb-2 block">Arka Plan Videosu (İsteğe Bağlı)</label>
                                        <button
                                            onClick={() => document.getElementById('wiz-video-custom').click()}
                                            className={`w-full p-5 rounded-2xl border-2 border-dashed flex items-center justify-center gap-3 transition-all ${customBgFile ? 'border-purple-500 bg-purple-500/10' : 'border-gray-800 bg-[#141417]'}`}
                                        >
                                            <Icon
                                                className={customBgFile ? "text-purple-400" : "text-gray-500"}
                                                name={customBgFile ? "CheckCircle2" : "Video"}
                                                size={22}
                                            />
                                            <span className="text-xs font-medium text-gray-300 truncate max-w-[80%]">
                                                {customBgFile ? customBgFile.name : "MP4 / WebM Video Seç"}
                                            </span>
                                        </button>
                                        <input type="file" id="wiz-video-custom" accept="video/*" className="hidden" onChange={e => { const f = e.target.files[0]; if (f) setCustomBgFile(f); }} />
                                    </div>
                                )}

                                <div>
                                    <label className="text-gray-400 text-[11px] font-bold uppercase tracking-wider ml-1 mb-2 block">Tipografi</label>
                                    <div className="grid grid-cols-1 gap-2">
                                        {FONTS.map(f => (
                                            <button
                                                key={f.id}
                                                onClick={() => setFont(f.id)}
                                                className={`w-full p-3.5 rounded-xl border text-left flex justify-between items-center ${f.class} ${font === f.id ? 'bg-white/10 border-white/30 text-white' : 'bg-[#141417] border-transparent text-gray-400'}`}
                                            >
                                                <span className="text-base">{f.name}</span>
                                                {font === f.id && <Icon className="text-blue-400" name="Check" size={16} />}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-panel p-4 rounded-2xl space-y-3">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-sm font-bold text-white">Gemini AI Otomatik Çözümleme</p>
                                            <p className="text-[11px] text-gray-400">{effectiveApiKey ? "Sesi dinleyip zaman kodlu sözleri çıkarır" : "API Key girilmediği için manuel mod aktif"}</p>
                                        </div>
                                        <button
                                            disabled={!effectiveApiKey}
                                            onClick={() => setSkipAI(!skipAI)}
                                            className={`w-12 h-7 rounded-full transition-colors p-1 ${!skipAI && effectiveApiKey ? 'bg-blue-600' : 'bg-gray-700'}`}

                                        </button>
                                    </div>
                                    {(skipAI || !effectiveApiKey) && (
                                        <textarea
                                            rows={4}
                                            value={manualText}
                                            onChange={e => setManualText(e.target.value)}
                                            placeholder="Sözleri veya [00:12.50] formatında LRC metnini buraya yapıştırabilirsin..."
                                            className="w-full bg-black/60 text-white text-xs p-3 rounded-xl border border-white/10 focus:border-blue-500"
                                        />
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="absolute bottom-8 left-0 right-0 px-6 z-20">
                        <button
                            onClick={step === 1 ? () => setStep(2) : handleFinish}
                            disabled={!name.trim() || !audioFile}
                            className={`w-full py-4 rounded-full font-bold text-base transition-all ${(!name.trim() || !audioFile) ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-xl shadow-blue-950'}`}

        // --- SETTINGS VIEW ---

            return (
                <div className="fixed inset-0 bg-black flex flex-col z-50 slide-in-right w-full h-full">

                            <Icon name="ChevronLeft" size={18} /> Projeler
                        </button>

                    <div className="flex-1 overflow-y-auto p-6 space-y-6">

                            </div>

                            <div>
                                <label className="text-gray-400 text-[11px] font-bold ml-1 mb-2 block uppercase tracking-wider">Google AI Studio API Key</label>
                                <input
                                    type="password"
                                    value={settings.apiKey}
                                    onChange={(e) => saveSettings({ ...settings, apiKey: e.target.value.trim() })}
                                    className="w-full bg-[#111114] text-white p-4 rounded-2xl border border-white/10 focus:border-blue-500 font-mono text-sm"

                                    type="text"

                                <div className="flex flex-wrap gap-2">
                                    {presets.map(m => (
