name: Build Android APK (Cordova)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Lisanslarını Onayla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cordova Projesini Hazırla ve Derle
        run: |
          npm install -g cordova
          cordova create build_app com.nurullah.lyricalai "LyricalAI"
          cp config.xml build_app/config.xml
          cp index.html build_app/www/index.html
          if [ -f "icon.png" ]; then cp icon.png build_app/icon.png; else sed -i '/<icon/d' build_app/config.xml; fi
          cd build_app
          cordova platform add android
          cordova build android --debug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: LyricalAI-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
