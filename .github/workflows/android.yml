name: Build Android APK (Cordova)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 Kur (Android Build İçin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Cordova Kur ve Klasörleri Hazırla
        run: |
          npm install -g cordova
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; fi

      - name: Android Platformu Ekle ve APK Derle
        run: |
          cordova platform add android
          cordova build android --debug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: LyricalAI-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
